[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daybagger"
version = "0.1.0"
description = "Daybagger Indian equity meta-intelligence trading foundation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
daybagger = "daybagger.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
